<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#4A9FE8">
  <title>我的日程 · 更新服务</title>
  <style>
    :root {
      color-scheme: light;
      --canvas: #F4F8FC;
      --surface: #FFFFFF;
      --ink: #193752;
      --muted: #6F8194;
      --blue: #2878D0;
      --line: #E4EEF7;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 18% 12%, #E4F1FF 0, transparent 34%),
        radial-gradient(circle at 84% 88%, #EAF7F3 0, transparent 30%),
        var(--canvas);
      font-family: "Nunito", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink);
    }
    .card {
      width: min(100%, 440px);
      padding: 34px 30px;
      border: 1px solid rgba(255, 255, 255, .9);
      border-radius: 24px;
      background: color-mix(in srgb, var(--surface) 94%, transparent);
      box-shadow: 0 18px 50px rgba(28, 70, 112, .12);
      text-align: center;
    }
    .mark {
      width: 56px;
      height: 56px;
      margin: 0 auto 20px;
      border-radius: 17px;
      background: var(--blue);
      color: #fff;
      display: grid;
      place-items: center;
      box-shadow: 0 8px 20px rgba(40, 120, 208, .24);
    }
    .mark svg { width: 30px; height: 30px; }
    h1 {
      margin: 0;
      font-size: 25px;
      letter-spacing: -.02em;
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-top: 13px;
      padding: 6px 11px;
      border-radius: 999px;
      background: #EAF7F1;
      color: #17795C;
      font-size: 13px;
      font-weight: 700;
    }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #35B58A;
    }
    p {
      margin: 22px 0 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.75;
    }
    .path {
      display: inline-block;
      margin-top: 16px;
      padding: 9px 13px;
      border-radius: 11px;
      background: var(--canvas);
      border: 1px solid var(--line);
      color: var(--ink);
      font-size: 14px;
      font-weight: 650;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12.5l4.3 4.3L19 7"/>
      </svg>
    </div>
    <h1>我的日程</h1>
    <div class="status"><span class="dot"></span>更新服务运行正常</div>
    <p>这里负责向 Android 客户端提供版本信息与安装包。请打开 App，在设置中检查新版本。</p>
    <div class="path">设置 → 软件更新</div>
  </main>
</body>
</html>
